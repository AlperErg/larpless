# Netlify's base directory is site/. Build with Vite and publish its output:
# public/ (home.webp, og.png…) is only copied to the web root by the build,
# and src/main.ts must be compiled before the browser can run it.
# Canonical, Open Graph, and sitemap URLs use Netlify's URL. Set SITE_URL when
# the public domain should differ from that origin.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Umami analytics, served from this domain so ad blockers don't drop it.
# status 200 makes this a rewrite (proxy), not a redirect. Events go to
# /_v/api/send, handled by netlify/edge-functions/umami-send.js so Umami sees
# the visitor's location instead of the Netlify server's.
[[redirects]]
  from = "/_v/s.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
