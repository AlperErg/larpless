name: macOS build

# Compiles the Swift side and links it against the JS app. Jest can't cover this, and macOS
# runners cost 10× Linux minutes, so it only runs on pull requests into main.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: larpless
    env:
      # CocoaPods refuses to run without a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: larpless/package-lock.json

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: larpless/macos/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('larpless/macos/Podfile.lock', 'larpless/package-lock.json') }}

      - name: pod install
        working-directory: larpless/macos
        run: pod install

      # The in-app Acknowledgements are generated from the JS bundles, the pods and licenses/.
      # Fails when a dependency changed without regenerating them.
      - name: Acknowledgements are up to date
        run: node scripts/acknowledgements.mjs --check

      # Debug signs ad-hoc ("-"), so no certificates are needed.
      - name: xcodebuild
        run: |
          xcodebuild -workspace macos/Focusline.xcworkspace -scheme Focusline-macOS -configuration Debug \
            -derivedDataPath macos/build -destination 'platform=macOS' -quiet build
